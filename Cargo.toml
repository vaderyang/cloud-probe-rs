[workspace]
resolver = "2"
members = [
    "crates/cpworker",
    "crates/cpgolib",
    "crates/cpctl",
    "crates/dockerpid",
    "crates/cripid",
    "crates/cpdaemon",
    "crates/sim",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/Netis/cloud-probe"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
nix = { version = "0.31", features = ["signal", "socket", "net", "fs", "process", "time", "sched", "hostname"] }
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"
byteorder = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4"
socket2 = { version = "0.5", features = ["all"] }
parking_lot = "0.12"
pcap = "2"
zmq = "0.10"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
