[workspace]
resolver = "2"
members = [
    "crates/cpworker",
    "crates/cpworker-parity",
    "crates/cpgolib",
    "crates/cpctl",
    "crates/dockerpid",
    "crates/cripid",
    "crates/cpdaemon",
    "crates/sim",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/Netis/cloud-probe"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
nix = { version = "0.31", features = ["signal", "socket", "net", "fs", "process", "time", "sched", "hostname", "poll"] }
log = "0.4"
env_logger = "0.11"
signal-hook = "0.4"
rand = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4"
socket2 = { version = "0.6", features = ["all"] }
parking_lot = "0.12"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
# AUDIT4 P5-23 - what "abort" means for this process, and the boundary we keep:
#
#   * A panic here is a *fatal*, not a recoverable, event: unwinding is compiled
#     out, so nothing can catch_unwind() and a panic in one task's thread takes
#     the whole worker (and every other task) with it.
#   * Therefore no error that is reachable from input may be a panic. Everything
#     driven by untrusted data - config JSON, CPM task updates, SIGHUP reloads,
#     BPF expressions, pcap files, peer bytes on the ZMTP wire, packet frames -
#     is a `Result` (cpworker::Error) or a plain early return.
#   * Panics are reserved for programmer errors: invariant violations asserted
#     with debug_assert! (single-FIFO write phase, ring-buffer accounting), which
#     trip in tests/debug and compile away in release.
#   * `parity/verify_hygiene.sh` greps the cpworker library for the panic
#     constructors that used to hide there (unwrap/expect/panic!/unreachable!),
#     because clippy and the test suite cannot see the difference between
#     "provably unreachable" and "someone will hit this at 3am".
# Tests run under the `test` profile (panic = unwind), so #[should_panic] and
# assertion failure reporting are unaffected.
panic = "abort"
