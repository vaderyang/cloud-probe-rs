# Behaviour coverage registry: requirement -> scenario -> state transition -> tests.
#
# Design: VERIFICATION_COVERAGE.md §5. P0 requirements MUST have 100% scenario
# coverage: every `tests` name below must exist as a real test function (the gate
# greps the crate sources), and every P0 requirement must map to at least one.
#
# Spec-first rule (ADR-0001): a `source` here is the specification the test is
# derived from, not the implementation. `tests` are test FUNCTION names.

[[requirement]]
id = "REQ-BPF-COMPILE"
priority = "P0"
source = "PARITY.md §4 (tcpdump subset)"
scenario = "compile the supported tcpdump subset and decide identically to libpcap"
tests = [
  "parses_direction_and_proto_syntax",
  "parses_basic_predicates",
  "and_or_precedence",
  "parentheses",
  "matches_ip_host_and_port",
  "long_port_or_chain_compiles",
  "long_not_host_chain_uses_trampolines_and_matches",
  "port_parsing_requires_plain_decimal",
]

[[requirement]]
id = "REQ-BPF-ETHER-PROTO"
priority = "P0"
source = "libpcap grammar: `ether proto` (PARITY.md §4; field report cloud-probe-rs-57d)"
scenario = "ether proto <num|name> compiles and decides exactly like libpcap, including the 802.3 length quirk"
tests = [
  "parses_ether_proto_numeric_and_named",
  "ether_proto_number_base_zero",
  "ether_proto_matches_ethertype_and_8023_length",
]

