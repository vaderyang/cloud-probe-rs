# Risk coverage registry: risk -> verification means (VERIFICATION_COVERAGE.md §6).
#
# Categories: security | concurrency | data_integrity | failure_modes.
# Evidence entries are `test:<fn>`, `path:<file>`, `cmd:<command>` or free text.
# Every P0 risk must have at least one *executable* evidence entry whose subject
# exists (`test:` name found in the sources, `path:` file exists, `cmd:` presence
# is recorded). P0 risk coverage must be 100%.

[[risk]]
id = "RISK-CPM-TLS"
category = "security"
priority = "P0"
source = "SECURITY.md / UPSTREAM_ISSUES #232 / PARITY.md §2.7"
description = "MITM on the CPM channel could inject tasks/BPF; the client now verifies the server certificate by default and only skips on explicit opt-in"
evidence = [
  "path:SECURITY.md",
  "path:verification/policy.toml",
  "test:self_signed_certificate_is_rejected_by_default",
  "test:self_signed_certificate_is_accepted_when_verification_is_skipped",
]

