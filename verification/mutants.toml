# cargo-mutants configuration (VERIFICATION_COVERAGE.md §7, ADR-0001).
#
# Scope is the pure-logic part of Tier 0 (and the small Tier 1 protocol client):
# the capture-ring paths (af_packet) are only exercised with CAP_NET_RAW in the
# privileged job and would otherwise show up as unviable/timeout noise, so they
# are mutated via the privileged job once live coverage is folded in (stage 2/3).
#
#   ./verify_mutation.sh            # this scope, full
#   ./verify_mutation.sh --in-diff  # only lines changed vs origin/main

examine_globs = [
  "crates/cpworker/src/bpf/**",
  "crates/cpworker/src/packet.rs",
  "crates/cpworker/src/packet_split.rs",
  "crates/cpworker/src/zmtp/**",
  "crates/cpworker/src/output/vxlan.rs",
  "crates/cpworker/src/output/gre.rs",
  "crates/cpworker/src/config.rs",
  "crates/cpgolib/src/**",
]

exclude_globs = [
  "crates/cpworker-parity/**",
  "crates/sim/**",
  "crates/*/tests/**",
  "crates/*/src/bin/**",
]

# Timeout budget. An `exclude_re` entry marked "runner timeout" means "this mutant
# makes the tests hang for at least this long", so the budget is part of the
# exclusion contract and must match the no-exclude sweep that produced the list
# (verification/MUTATION_BASELINE.md). cargo-mutants' default minimum (20 s) is
# tight enough that a slow-but-detected state-machine mutant is reported as a
# Timeout - a gate failure - depending on machine load, which is exactly what
# happened before this was pinned.
timeout_multiplier = 3.0
minimum_test_timeout = 120.0
# `exclude_re` is the *measured* list of mutants the test suite does not kill.
#
# It is regenerated from a full run of this configuration with `exclude_re`
# removed ("no-exclude sweep"), not written by hand, and every entry is pinned to
# the exact `file:line:col` that the sweep found. When a line holds both survivors
# and mutants the tests do kill, the entry carries the mutated operation as well,
# so an exclusion can never swallow real coverage.
#
# Each entry states why it is tolerable:
#   * "runner timeout": the mutation makes the code loop or sleep forever, so no
#     finite test can report a failure (cargo-mutants reports Timeout, which the
#     blocking gate treats as a failure so it must be listed here);
#   * an arithmetic identity (disjoint-bit `|` vs `^`, a clamp at equality, ...);
#   * an unobservable difference (a log line, a timing constant, a measure-zero
#     `Instant` boundary, a best-effort syscall on a socket that is closing).
#
# Re-baseline procedure (see verification/MUTATION_BASELINE.md):
#   1. strip `exclude_re` into a scratch config and run the full sweep;
#   2. `verification/mutation_config_gate.py --outcomes <that run>/mutants.out/outcomes.json`
#      -- it fails if an entry matches no candidate (line drift), if an entry
#      also matches a mutant the tests kill (over-broad), if a surviving mutant
#      is not covered (incomplete), or if an entry lacks a reason;
#   3. refresh this list from the sweep.
#
# A pinned entry goes stale when the file is edited. The gate above fails on the
# first stale entry, which is what keeps this list from silently rotting (the
# previous revision of this file pinned `gre.rs` by line and rotted away).

