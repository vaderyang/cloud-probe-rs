# cargo-mutants configuration (VERIFICATION_COVERAGE.md §7, ADR-0001).
#
# Scope is the pure-logic part of Tier 0 (and the small Tier 1 protocol client):
# the capture-ring paths (af_packet) are only exercised with CAP_NET_RAW in the
# privileged job and would otherwise show up as unviable/timeout noise, so they
# are mutated via the privileged job once live coverage is folded in (stage 2/3).
#
#   ./verify_mutation.sh            # this scope, full
#   ./verify_mutation.sh --in-diff  # only lines changed vs origin/main

examine_globs = [
  "crates/cpworker/src/bpf/**",
  "crates/cpworker/src/packet.rs",
  "crates/cpworker/src/packet_split.rs",
  "crates/cpworker/src/zmtp/**",
  "crates/cpworker/src/output/vxlan.rs",
  "crates/cpworker/src/output/gre.rs",
  "crates/cpworker/src/config.rs",
  "crates/cpgolib/src/**",
]

exclude_globs = [
  "crates/cpworker-parity/**",
  "crates/sim/**",
  "crates/*/tests/**",
  "crates/*/src/bin/**",
]

# Mutating a Drop impl or a trivial main is noise here.
exclude_re = [
  "^impl .*Drop for",
  "^fn main$",
  # Equivalent or not-observable mutants, and root-only syscall wrappers:
  "gre\\.rs:33:",   # RawSocketEgress::send_to, the real sendto (root; live-capture)
  "gre\\.rs:70:",   # set_bind_device wrapper (root)
  "gre\\.rs:74:",   # set_pmtudisc wrapper (root)
  "gre\\.rs:133:",  # `> 0` vs `>= 0` only gates logging; the reset is idempotent
  "gre\\.rs:154:",  # slice == caplen: both branches produce the same length
  "gre\\.rs:205:",  # ENOBUFS backoff sleep duration is not observable behaviour
  "gre\\.rs:207:",
  "vxlan\\.rs:21:",  # set_bind_device wrapper (root)
  "vxlan\\.rs:25:",  # set_pmtudisc wrapper (root)
  "vxlan\\.rs:36:",  # odd-tail branch: the checksum region is always 42 bytes (even)
  "vxlan\\.rs:81:",  # VXLAN+ETH+20 is even, so a zero-padded even extension is sum-invariant
  "vxlan\\.rs:173:", # `> 0` vs `>= 0` only gates logging; the reset is idempotent
  "vxlan\\.rs:222:", # ENOBUFS backoff sleep duration is not observable behaviour
  "vxlan\\.rs:224:",
  "vxlan\\.rs:247:", # slice == caplen: both branches produce the same length
  "vxlan\\.rs:276:", # max_payload_size == 0 forces a fragment count of 1 either way
  # These three behave as the tests expect but make the cargo-mutants runner
  # hang (300s timeout); the behaviour is asserted by config::accessor_tests.
  "config\\.rs:549:",
  "config\\.rs:762:",
  "config\\.rs:1060:",
]

timeout_multiplier = 3.0
minimum_test_timeout = 60.0
