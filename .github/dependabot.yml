version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Group only minor/patch updates (usually compatible). Major updates are
    # left as individual PRs so a breaking bump (and any code migration) can be
    # reviewed on its own without hiding behind a large group.
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # AUDIT4 P5-28: crates/cpworker/fuzz is a standalone workspace with its own
  # Cargo.lock, so the entry above never resolves it and that lockfile would drift
  # unnoticed (the deny job now checks it; nothing kept it current). Dependabot
  # needs one entry per workspace root.
  - package-ecosystem: cargo
    directory: /crates/cpworker/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fuzz-cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
