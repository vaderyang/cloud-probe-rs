name: verification (nightly)

# The blocking gates (line/function, critical functions, no-decrease, diff) run
# on every PR/push in ci.yml. This workflow adds the expensive dimensions that
# do not belong on the critical path: branch coverage (needs nightly llvm-cov),
# mutation testing and the soaks. All four are blocking (ADR-0001 stage 3/4);
# branch coverage is anchored in verification/baseline.json's `branch_tiers`
# table (the nightly --branch collector maps lines differently from the stable
# one, so the two ratchets are kept separate).

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  branch-coverage:
    name: branch coverage (nightly llvm-cov)
    runs-on: ubuntu-latest
    # Blocking (ADR-0001 stage 2): the per-tier branch ratchet/target/waiver is
    # enforced below, against the `branch_tiers` baseline this job produces.
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect branch coverage
        # Fold the #[ignore]d AF_PACKET live tests in (as verify_coverage.sh
        # --privileged-live does) so the advisory report matches the blocking
        # gate's Tier 0 line floor; the root-only capturer path is not reachable
        # from the ordinary suite.
        run: |
          mkdir -p target/llvm-cov
          cargo +nightly llvm-cov --workspace --locked --branch --no-report
          # Search the whole coverage target dir: newer nightlies place the
          # integration-test binary under build/<crate>/<hash>/out/ instead of
          # debug/deps/ (the layout moved between cargo versions).
          BIN=$(find target/llvm-cov-target -type f \
            -name 'af_packet_live-*' ! -name '*.d' | head -n1)
          if [ -z "$BIN" ]; then
            echo "::error::no instrumented af_packet_live binary"
            exit 1
          fi
          PROFILE="$PWD/target/llvm-cov-target/af_live-%p.profraw"
          sudo -E env "LLVM_PROFILE_FILE=$PROFILE" "$BIN" --ignored
          cargo +nightly llvm-cov report --branch \
            --lcov --output-path target/llvm-cov/lcov.info
      - name: Tiered coverage gate (branch, no-decrease, waivers)
        # Blocking: consumes the --branch lcov collected above. The gate selects
        # the `branch_tiers` baseline because this report carries BRDA records.
        # Tier 0/1 are below their branch targets and carry explicit, unexpired
        # [[waiver]]s in policy.toml; Tier 2 is held at its 75% branch target;
        # line/function are ratcheted on the nightly collector's own baseline.
        run: |
          python3 verification/coverage_gate.py \
            --lcov target/llvm-cov/lcov.info --tolerance 0.5

  soak:
    name: DST soak (20000 seeds) + fd soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Blocking (ADR-0001 stage 4): the harness is deterministic, so a red
    # soak is always a real regression, and 20000 seeds costs ~3 min. The
    # fd soak guards the long-lived-daemon invariant (no leaked socket per
    # reconnect).
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Deterministic simulation soak
        # A failure prints the offending seed; reproduce with DST_SEED=<seed>.
        run: DST_SEED_RANGE=1-20000 cargo test -p cpsim --test dst --release
      - name: Descriptor-leak soak
        run: cargo test -p cpgolib --test fd_soak --release

  mutation-exemptions:
    name: mutation exemption hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADR-0001 §2.1: `exclude_re` is the only way a surviving mutant may be
    # tolerated, so the exemption list itself is gated: every entry must still
    # match a candidate mutant (source lines do not silently drift), carry a
    # written reason, and be a valid regex. Listing mutants needs no build.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Check exemptions
        run: ./verification/mutation_config_gate.py

  mutation:
    name: mutation (cargo-mutants shard ${{ matrix.shard }})
    needs: mutation-exemptions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Done once, in the mutation-exemptions job.
      SKIP_MUTATION_CONFIG_GATE: "1"
    # Blocking (ADR-0001 stage 4): the full Tier 0/1 scope is clean (0 surviving
    # mutants outside the documented `exclude_re` entries; see
    # verification/MUTATION_BASELINE.md), so every shard must stay green. The
    # run is sharded so a weekly run is bounded.
    #
    # The shard list is 0-based integers because cargo-mutants shards are
    # 0-based: `--shard k/n` requires k < n, so the values are 0/4..3/4 and
    # `4/4` is rejected outright. The first version used 1..4, which failed one
    # shard every run and silently never tested shard 0. Keep the integers so
    # the uploaded artifact name stays filesystem-safe (`--shard k/n` is
    # assembled in the run step).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run mutation testing
        run: ./verify_mutation.sh --shard "${{ matrix.shard }}/4"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: warn
