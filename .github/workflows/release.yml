name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Least privilege for the whole workflow (AUDIT4 P5-27): building and
  # uploading artifacts needs a read token only. The one job that creates a
  # GitHub Release raises this to contents: write on itself.
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cross-linker for the aarch64-linux artifact (installed in the Linux system
  # deps step below). Ignored by the other matrix targets.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Best-effort for the Intel macOS runner (may not always be available).
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            optional: true
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        # protoc is a *build-time* tool for cripid's `build.rs` (prost/tonic
        # code generation from the vendored proto/api.proto). Nothing links a C
        # library: AUDIT4 P5-25 removed the macOS `brew install libpcap zeromq`,
        # which was a leftover from before the pure-Rust pcap/ZMTP ports
        # and only made the release job depend on packages the build
        # never reads.
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross is only a *recommendation* of
          # gcc-aarch64-linux-gnu; --no-install-recommends skipped it, and
          # ring's C build then failed on missing bits/libc-header-start.h when
          # cross-compiling to aarch64.
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        # --locked: the artifact must be reproducible from the committed
        # Cargo.lock, not from whatever crates.io resolves to today.
        run: |
          cargo build --release --workspace --locked \
            --bin cpworker --bin cpctl --bin cpdaemon \
            --bin dockerpid --bin cripid \
            --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          # shellcheck disable=SC2015
          set -euo pipefail
          bin="target/${{ matrix.target }}/release"
          name="cloud-probe-rs-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for b in cpworker cpctl cpdaemon dockerpid cripid; do
            cp "$bin/$b" "dist/$name/"
          done
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # shellcheck disable=SC2015
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" || \
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: cloud-probe-rs-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Publishing a release + its assets is the only step in this workflow that
      # needs a write token.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true
