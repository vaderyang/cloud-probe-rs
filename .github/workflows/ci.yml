name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  coverage:
    name: coverage (llvm-cov)
    # Advisory: reports line coverage and uploads an lcov artifact. It is not a
    # hard gate yet (see IMPROVEMENT_PLAN.md P2.3).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  deny:
    name: licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # deny.toml: permissive / non-GPL allow-list, RustSec advisories, yanked
      # crates denied, source/registry allow-list.
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Assert no GPL-family license is allowed
        run: |
          # The allow-list is deny-by-default, so GPL cannot pass unless someone
          # adds it to deny.toml. Guard against that explicitly (ignoring
          # comments, which document the policy).
          if grep -v '^[[:space:]]*#' deny.toml | grep -Eiq 'GPL|AGPL|LGPL|SSPL'; then
            echo '::error::deny.toml must not allow GPL-family licenses'
            exit 1
          fi
          echo 'OK: no GPL-family license in deny.toml'

  security:
    name: cargo-audit (CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies against the RustSec advisory DB
        run: cargo audit

  dependency-review:
    name: dependency review
    # GitHub's dependency-review needs the repository Dependency graph feature
    # (Settings -> Security) and a write token, which Dependabot PRs do not get.
    # Keep it advisory: skip Dependabot PRs and never block the build.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  parity:
    name: differential parity (C vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reference C/Go sources
        uses: actions/checkout@v7
        with:
          repository: netis/cloud-probe
          ref: 0.9.x
          path: cloud-probe
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libzmq3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all differential + protocol fuzz harnesses
        env:
          CLOUD_PROBE_SRC: ${{ github.workspace }}/cloud-probe
          PACKET_N: "2000"
          CONFIG_N: "1000"
          REQ_N: "1000"
          PROTO_CASES: "30"
          PROTO_SEEDS: "3"
        run: bash parity/all.sh

  fuzz:
    name: cargo-fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reference C/Go sources (for differential fuzzing)
        uses: actions/checkout@v7
        with:
          repository: netis/cloud-probe
          ref: 0.9.x
          path: cloud-probe
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libzmq3-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz smoke (5s per target)
        run: ./fuzz.sh --check
      - name: Differential fuzz smoke vs C (5s per mode)
        env:
          CLOUD_PROBE_SRC: ${{ github.workspace }}/cloud-probe
        run: ./parity/difffuzz.sh 5 all
