name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege for every job by default (AUDIT4 P5-27). A job that needs more
# says so on its own (dependency-review: pull-requests: write).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  actionlint:
    name: actionlint (workflows)
    # Lint the workflow YAML itself (qwen P3 optional hardening; verified locally
    # with actionlint 1.7.12, which is clean on these files). We install a pinned
    # tool version via the same action the coverage job uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint (pinned; GitHub release, not crates.io)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin actionlint
          actionlint -version
      - run: actionlint -color

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # AUDIT4 §3.1: interfaces that are implemented but never called are invisible
      # to dead_code/clippy (P5-04). Guard them explicitly.
      - run: bash parity/verify_liveness.sh
      # AUDIT4 §3 / WP4: truncating casts in the config layer, panic constructors
      # on library paths (release uses panic="abort"), docs that overstate what
      # they do, fuzz targets that exist but are never run.
      - run: bash parity/verify_hygiene.sh
      # AUDIT4 P2-3: re-inject each of those four violations in a *rewritten* form
      # (as libc::c_int, a [[bin]] with path before name, a doc line quoting the
      # old exemption keywords) and require the gates above to go red.
      - run: bash parity/verify_hygiene_reverse.sh

  msrv:
    name: MSRV 1.88 build
    # Cargo.toml declares `rust-version = "1.88"`; until now every job ran on
    # @stable, so "requires Rust 1.88+" was a claim nothing checked (AUDIT4
    # P5-26). This job is the check: if a feature newer than 1.88 slips into a
    # code path, or a dependency bump raises its own MSRV, it fails here instead
    # of on a downstream user's machine. --locked is what makes the dependency
    # half of that statement reproducible.
    #
    # --all-targets (AUDIT4 GLM P3-1): plain `cargo build` skips dev-dependencies
    # and `tests/`, so a dev-dep MSRV bump - or a test using a feature newer than
    # 1.88 - stayed green here and only failed for whoever next ran `cargo test`.
    # The job now covers the whole build graph, which is what the README claims.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not share a cache with the stable jobs: artifacts built by 1.88
          # and by stable are not interchangeable.
          key: msrv-1.88
      - run: cargo build --workspace --all-targets --locked

  live-capture:
    name: live capture (privileged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the live-capture test
        run: cargo test -p cpworker --test af_packet_live --no-run --locked
      - name: Run AF_PACKET capture test on lo and on a veth as root
        # Covers the real AF_PACKET path (socket/bind ordering, SO_ATTACH_FILTER,
        # SO_RCVBUFFORCE with CAP_NET_ADMIN, timestamps, VLAN reinsertion) and the
        # veth capture-fidelity contract (inject exactly N raw frames => the capturer
        # delivers exactly those N, in order, drop == 0) that the other jobs skip.
        # qwen §4-5/§4-7: that contract used to live only in the manual
        # `bench/live_bench.py` ratio, which no gate ran.
        #
        # AUDIT4 P2-2: this job used to be able to go green while executing
        # nothing. Two independent ways to do that existed: the tests returned
        # early when unprivileged (reported `ok. 4 passed`), and `--ignored` also
        # exits 0 when it matches zero tests (stale binary picked up by `find`, a
        # test renamed, or a lost `#[ignore]`). The tests now panic instead of
        # skipping, and the job asserts that the number of ignored tests the
        # binary *advertises* is the number that actually *executed*.
        run: |
          BIN=$(find target/debug/deps -maxdepth 1 -type f -name 'af_packet_live-*' ! -name '*.d' | head -n1)
          test -n "$BIN" || { echo "::error::no af_packet_live test binary was built"; exit 1; }
          echo "running $BIN"
          N=$("$BIN" --ignored --list | sed -n '/: test$/p' | wc -l)
          echo "binary advertises $N ignored live-capture test(s)"
          [ "$N" -ge 5 ] || { echo "::error::expected at least 5 ignored live tests, found $N"; exit 1; }
          # shellcheck disable=SC2024
          # The redirect is intentional: the log is written as the runner user
          # so the greps below can read it.
          sudo -E "$BIN" --ignored --nocapture > live-capture.log 2>&1 || true
          cat live-capture.log
          grep -q "test result: ok. $N passed; 0 failed" live-capture.log \
            || { echo "::error::live capture did not execute all $N tests"; exit 1; }
          # The count above proves the suite executed; this proves the fidelity gate
          # itself is still one of them (a renamed or de-`#[ignore]`d test would keep
          # the count honest but silently drop the contract it guards).
          grep -qx "test live_capture_veth_delivers_exactly_n_frames ... ok" live-capture.log \
            || { echo "::error::the veth capture-fidelity gate did not execute and pass"; exit 1; }

      - name: Build the daemon-to-worker spawn test and its cpworker
        run: |
          cargo build -p cpworker --locked
          cargo test -p cpdaemon --test worker_supervision --no-run --locked

      - name: Run the daemon-to-worker spawn test as root
        # DS-3 (review of the cpdaemon e2e tests): the
        # strategy -> WorkerManager -> real cpworker spawn bridge had no
        # end-to-end coverage. The unprivileged suites stop at the config layer,
        # because the bridge always builds a libpcap capturer and that needs
        # CAP_NET_RAW. The test is #[ignore]d and panics (never skips) without
        # privileges, and this step asserts it actually executed.
        run: |
          BIN=$(find target/debug/deps -maxdepth 1 -type f -name 'worker_supervision-*' ! -name '*.d' | head -n1)
          test -n "$BIN" || { echo "::error::no worker_supervision test binary was built"; exit 1; }
          N=$("$BIN" --ignored --list | sed -n '/: test$/p' | wc -l)
          echo "binary advertises $N ignored spawn test(s)"
          [ "$N" -ge 1 ] || { echo "::error::expected at least 1 ignored spawn test, found $N"; exit 1; }
          # shellcheck disable=SC2024
          # The redirect is intentional: the log is written as the runner user
          # so the greps below can read it.
          sudo -E "$BIN" --ignored --nocapture > spawn.log 2>&1 || true
          cat spawn.log
          grep -q "test result: ok. $N passed; 0 failed" spawn.log \
            || { echo "::error::the spawn test did not execute/pass"; exit 1; }
          grep -qx "test worker_manager_spawns_the_real_cpworker ... ok" spawn.log \
            || { echo "::error::the daemon-to-worker spawn gate did not execute and pass"; exit 1; }

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  verify-coverage:
    name: verification coverage (tiered, blocking)
    # Blocking since ADR-0001: per-tier line/function coverage, critical-function
    # 100% function coverage, coverage-must-not-decrease and changed-line (diff)
    # coverage, plus the P0 behaviour-coverage gate. See VERIFICATION_COVERAGE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Diff coverage needs the PR base commit to be reachable.
          fetch-depth: 0
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage
        # Goes through the script so the output directory is created the same way
        # locally and here; calling cargo-llvm-cov directly used to fail with
        # `failed to create file target/llvm-cov/lcov.info` on a clean checkout.
        # `--privileged-live` also folds the #[ignore]d AF_PACKET live tests
        # (run under sudo) into the report. That root-only capturer path is what
        # lifts Tier 0's line coverage past its 95% target.
        run: ./verify_coverage.sh --privileged-live
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - name: Tiered coverage gate (line/function, critical functions, no-decrease, diff)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python3 verification/coverage_gate.py --lcov target/llvm-cov/lcov.info --tolerance 0.5
          else
            python3 verification/coverage_gate.py --lcov target/llvm-cov/lcov.info \
              --tolerance 0.5 --diff --diff-base "$BASE"
          fi
      - name: Behaviour coverage gate (P0 scenario = 100%)
        run: python3 verification/requirements_gate.py
      - name: Risk coverage gate (P0 risks verified)
        run: python3 verification/risk_gate.py
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/llvm-cov/lcov.info
          if-no-files-found: warn

  mutation-diff:
    name: mutation (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Blocking (ADR-0001 stage 4): any surviving mutant on the changed lines fails
    # the PR, unless it is justified in verification/mutants.toml `exclude_re`.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate only changed lines
        run: ./verify_mutation.sh --in-diff "${{ github.event.pull_request.base.sha }}"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-diff
          path: mutants.out
          if-no-files-found: warn

  lint-workflows:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    # §6 of the P2 summary: "actionlint clean" was quoted as evidence in the audits
    # while nothing in CI (and, at that point, nothing on the auditing machine either)
    # ever ran it. The workflow files are code that a shell job executes, and a typo in
    # a `run:` block or a bad expression is only discovered by a failing job.
    #
    # Version pinned (same discipline as fuzz.sh's cargo-fuzz pin, AUDIT4 P3-5): a
    # moving "latest" would let the gate's verdict change under a commit that did not
    # touch the workflows. 1.7.12 is the version verified locally; note that the older
    # 1.7.7 rejects `macos-15-intel` in release.yml as an unknown runner label, so a
    # downgrade would go red for a reason unrelated to the workflows.
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint (pinned; GitHub release, not crates.io)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin actionlint
          actionlint -version
      - name: actionlint
        run: actionlint

  deny:
    name: licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # AUDIT4 P5-28: the repo has TWO dependency graphs. crates/cpworker/fuzz is
      # a standalone workspace (nightly + libFuzzer), so the root `cargo deny
      # check` never looked at its lockfile - and it turned out to be holding a
      # license the policy had never considered (libfuzzer-sys: NCSA). Assert both
      # lockfiles are the committed ones, then check both graphs.
      - name: Both Cargo.lock files are current
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 \
            --manifest-path crates/cpworker/fuzz/Cargo.toml > /dev/null
      # deny.toml: permissive / non-GPL allow-list, RustSec advisories, yanked
      # crates denied, source/registry allow-list, wildcard versions denied.
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo deny (fuzz workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./crates/cpworker/fuzz/Cargo.toml
      - name: Assert no GPL-family license is allowed
        run: |
          # The allow-list is deny-by-default, so GPL cannot pass unless someone
          # adds it to deny.toml. Guard against that explicitly (ignoring
          # comments, which document the policy).
          if grep -v '^[[:space:]]*#' deny.toml | grep -Eiq 'GPL|AGPL|LGPL|SSPL'; then
            echo '::error::deny.toml must not allow GPL-family licenses'
            exit 1
          fi
          echo 'OK: no GPL-family license in deny.toml'

  security:
    name: cargo-audit (CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # GLM P3-3: this job audited the root Cargo.lock only, while the repo has a
      # second dependency graph (crates/cpworker/fuzz, its own committed lockfile).
      # `cargo audit --file <lockfile>` is supported (verified with
      # `cargo audit --help` on cargo-audit 0.22.2: "-f, --file <FILE>  Cargo lockfile
      # to inspect"), and the advisory DB is fetched once and cached in ~/.cargo, so
      # the second invocation costs a re-read, not another clone.
      - name: Audit dependencies against the RustSec advisory DB
        run: cargo audit --file Cargo.lock
      - name: Audit the fuzz workspace lockfile too
        run: cargo audit --file crates/cpworker/fuzz/Cargo.lock

  dependency-review:
    name: dependency review
    # GitHub's dependency-review needs the repository Dependency graph feature
    # (Settings -> Security) and a write token, which Dependabot PRs do not get.
    # Keep it advisory: skip Dependabot PRs and never block the build.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  parity:
    name: differential parity (C vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reference C/Go sources
        uses: actions/checkout@v7
        with:
          repository: netis/cloud-probe
          ref: 0.9.x
          path: cloud-probe
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libzmq3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all differential + protocol fuzz harnesses
        env:
          CLOUD_PROBE_SRC: ${{ github.workspace }}/cloud-probe
          PACKET_N: "2000"
          CONFIG_N: "1000"
          REQ_N: "1000"
          PROTO_CASES: "30"
          PROTO_SEEDS: "3"
        run: bash parity/all.sh

  fuzz:
    name: cargo-fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reference C/Go sources (for differential fuzzing)
        uses: actions/checkout@v7
        with:
          repository: netis/cloud-probe
          ref: 0.9.x
          path: cloud-probe
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libzmq3-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz smoke (5s per target)
        run: ./fuzz.sh --check
      - name: Differential fuzz smoke vs C (5s per mode)
        env:
          CLOUD_PROBE_SRC: ${{ github.workspace }}/cloud-probe
        run: ./parity/difffuzz.sh 5 all
      - name: Upload mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: difffuzz-artifacts
          path: |
            crates/cpworker/fuzz/artifacts/
            /tmp/difffuzz_last.txt
          if-no-files-found: ignore
