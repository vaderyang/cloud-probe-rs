name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege for every job by default (AUDIT4 P5-27). A job that needs more
# says so on its own (dependency-review: pull-requests: write).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # AUDIT4 §3.1: interfaces that are implemented but never called are invisible
      # to dead_code/clippy (P5-04). Guard them explicitly.
      - run: bash parity/verify_liveness.sh
      # AUDIT4 §3 / WP4: truncating casts in the config layer, panic constructors
      # on library paths (release uses panic="abort"), docs that overstate what
      # they do, fuzz targets that exist but are never run.
      - run: bash parity/verify_hygiene.sh

  msrv:
    name: MSRV 1.88 build
    # Cargo.toml declares `rust-version = "1.88"`; until now every job ran on
    # @stable, so "requires Rust 1.88+" was a claim nothing checked (AUDIT4
    # P5-26). This job is the check: if a feature newer than 1.88 slips into a
    # code path, or a dependency bump raises its own MSRV, it fails here instead
    # of on a downstream user's machine. --locked is what makes the dependency
    # half of that statement reproducible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not share a cache with the stable jobs: artifacts built by 1.88
          # and by stable are not interchangeable.
          key: msrv-1.88
      - run: cargo build --workspace --locked

  live-capture:
    name: live capture (privileged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the live-capture test
        run: cargo test -p cpworker --test af_packet_live --no-run --locked
      - name: Run AF_PACKET capture test on lo as root
        # Covers the real AF_PACKET path (socket/bind ordering, SO_ATTACH_FILTER,
        # SO_RCVBUFFORCE with CAP_NET_ADMIN, timestamps) that the other jobs skip.
        run: |
          BIN=$(find target/debug/deps -maxdepth 1 -type f -name 'af_packet_live-*' ! -name '*.d' | head -n1)
          echo "running $BIN"
          sudo -E "$BIN" --ignored --nocapture

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  coverage:
    name: coverage (llvm-cov)
    # Advisory: reports line coverage and uploads an lcov artifact. It is not a
    # hard gate yet (see IMPROVEMENT_PLAN.md P2.3).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  deny:
    name: licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # AUDIT4 P5-28: the repo has TWO dependency graphs. crates/cpworker/fuzz is
      # a standalone workspace (nightly + libFuzzer), so the root `cargo deny
      # check` never looked at its lockfile - and it turned out to be holding a
      # license the policy had never considered (libfuzzer-sys: NCSA). Assert both
      # lockfiles are the committed ones, then check both graphs.
      - name: Both Cargo.lock files are current
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 \
            --manifest-path crates/cpworker/fuzz/Cargo.toml > /dev/null
      # deny.toml: permissive / non-GPL allow-list, RustSec advisories, yanked
      # crates denied, source/registry allow-list, wildcard versions denied.
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo deny (fuzz workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./crates/cpworker/fuzz/Cargo.toml
      - name: Assert no GPL-family license is allowed
        run: |
          # The allow-list is deny-by-default, so GPL cannot pass unless someone
          # adds it to deny.toml. Guard against that explicitly (ignoring
          # comments, which document the policy).
          if grep -v '^[[:space:]]*#' deny.toml | grep -Eiq 'GPL|AGPL|LGPL|SSPL'; then
            echo '::error::deny.toml must not allow GPL-family licenses'
            exit 1
          fi
          echo 'OK: no GPL-family license in deny.toml'

  security:
    name: cargo-audit (CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies against the RustSec advisory DB
        run: cargo audit

  dependency-review:
    name: dependency review
    # GitHub's dependency-review needs the repository Dependency graph feature
    # (Settings -> Security) and a write token, which Dependabot PRs do not get.
    # Keep it advisory: skip Dependabot PRs and never block the build.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  parity:
    name: differential parity (C vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reference C/Go sources
        uses: actions/checkout@v7
        with:
          repository: netis/cloud-probe
          ref: 0.9.x
          path: cloud-probe
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libzmq3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all differential + protocol fuzz harnesses
        env:
          CLOUD_PROBE_SRC: ${{ github.workspace }}/cloud-probe
          PACKET_N: "2000"
          CONFIG_N: "1000"
          REQ_N: "1000"
          PROTO_CASES: "30"
          PROTO_SEEDS: "3"
        run: bash parity/all.sh

  fuzz:
    name: cargo-fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reference C/Go sources (for differential fuzzing)
        uses: actions/checkout@v7
        with:
          repository: netis/cloud-probe
          ref: 0.9.x
          path: cloud-probe
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libzmq3-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz smoke (5s per target)
        run: ./fuzz.sh --check
      - name: Differential fuzz smoke vs C (5s per mode)
        env:
          CLOUD_PROBE_SRC: ${{ github.workspace }}/cloud-probe
        run: ./parity/difffuzz.sh 5 all
