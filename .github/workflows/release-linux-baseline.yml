name: Release (Linux glibc 2.17 baseline)

# The default `Release` workflow builds the Linux `*-unknown-linux-gnu`
# artifacts on `ubuntu-latest`, i.e. against glibc 2.39.  Measured on a local
# build: those binaries require GLIBC_2.34, so they abort with
# "GLIBC_2.34 not found" on CentOS 7 / RHEL 7-8 / Kylin V10 / UOS /
# OpenEuler 20.03 -- most of the OneBoot ISO fleet (see docs/ONEBOOT_LAB.md).
#
# This workflow produces a second, portable set built inside the
# manylinux2014 images (CentOS 7, glibc 2.17).  The validated x86_64 recipe
# yields binaries whose highest requirement is GLIBC_2.16, so they run on
# every glibc >= 2.17 distro.  Artifacts are namespaced with `-glibc217` so
# the lab inventory can pick them explicitly:
#
#   "artifact": "x86_64-unknown-linux-gnu-glibc217"
#
# The build runs via `docker run` (not a container job) so the normal
# ubuntu runner performs checkout/package/upload; the exact command was
# verified by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: glibc217 ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
            protoc_arch: x86_64
          # Mirrors the validated x86_64 recipe; first run is expected to
          # confirm it (arm64 runners are the only way to run the arm64 image).
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
            protoc_arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Fetch protoc on the runner
        env:
          PROTOC_ARCH: ${{ matrix.protoc_arch }}
        run: |
          set -euo pipefail
          pv=27.3
          base=https://github.com/protocolbuffers/protobuf/releases
          mkdir -p .protoc
          curl -sSL --retry 5 --retry-connrefused -o .protoc/protoc.zip \
            "$base/download/v${pv}/protoc-${pv}-linux-${PROTOC_ARCH}.zip"
          ls -la .protoc

      - name: Build inside the glibc 2.17 container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # The container here has no route to the protoc release CDN, so the
          # runner fetches it above and mounts it in.  UID_HOST/GID_HOST give
          # the root-owned build tree back to the runner user for packaging.
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker run --rm \
            -v "$PWD":/src -w /src \
            -v "$PWD/.protoc/protoc.zip":/tmp/protoc.zip:ro \
            -e "HOST_UID=$host_uid" -e "HOST_GID=$host_gid" \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              # Rust toolchain (the image ships none).  The CentOS 7 curl is
              # too old for --retry-connrefused, so only --retry here.
              curl -sSf --retry 5 \
                https://sh.rustup.rs \
                | sh -s -- -y --profile minimal >/dev/null 2>&1
              . "$HOME/.cargo/env"
              # cripid build.rs needs protoc; the image has no package for it.
              unzip -q -o /tmp/protoc.zip -d /usr/local
              chmod +x /usr/local/bin/protoc
              rustc --version
              protoc --version
              cargo build --release --workspace --locked \
                --bin cpworker --bin cpctl --bin cpdaemon \
                --bin dockerpid --bin cripid
              # Hand the build tree back so the runner user can package it.
              chown -R "$HOST_UID:$HOST_GID" target
            '

      - name: Verify the glibc floor
        run: |
          set -euo pipefail
          # Highest `2.<minor>` versioned symbol the binary imports.  Symbols
          # like GLIBC_2.2.5 collapse to minor 2, so compare the max minor
          # numerically rather than the version string.
          minor="$(objdump -T target/release/cpworker \
            | grep -oE 'GLIBC_2\.[0-9]+' \
            | sed 's/^GLIBC_2\.//' | sort -n | tail -1)"
          case "$minor" in
            ''|*[!0-9]*)
              echo "::error::could not parse a glibc floor from cpworker"
              exit 1
              ;;
          esac
          echo "cpworker requires glibc 2.$minor"
          if [ "$minor" -gt 17 ]; then
            echo "::error::glibc floor regressed above 2.17 (2.$minor)"
            exit 1
          fi
          echo "glibc floor OK (<= 2.17)"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release"
          name="cloud-probe-rs-${{ matrix.target }}-glibc217"
          mkdir -p "dist/$name"
          for b in cpworker cpctl cpdaemon dockerpid cripid; do
            cp "$bin/$b" "dist/$name/"
          done
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" \
            > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-probe-rs-${{ matrix.target }}-glibc217
          path: dist/*.tar.gz*
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: false
