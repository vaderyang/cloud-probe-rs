[package]
name = "cpdaemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloud Probe management daemon (Rust port of cpdaemon)"
publish = false   # internal port; see deny.toml [bans] allow-wildcard-paths

[[bin]]
name = "cpdaemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
nix.workspace = true
log.workspace = true
cpgolib = { path = "../cpgolib" }

[dev-dependencies]
# Drives the real `cpworker` binary from the end-to-end tests under `tests/`.
tempfile = "3"
