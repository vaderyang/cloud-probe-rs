[package]
name = "cpdaemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloud Probe management daemon (Rust port of cpdaemon)"
publish = false   # internal port; see deny.toml [bans] allow-wildcard-paths

[[bin]]
name = "cpdaemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
axum.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
nix.workspace = true
log.workspace = true
cpgolib = { path = "../cpgolib" }
# PKCS#12 client identity (mTLS). `p12` is the pure-Rust decoder for the legacy
# PBE-SHA1-RC2-40 / PBE-SHA1-3DES schemes that the Go oracle's
# `golang.org/x/crypto/pkcs12` also accepts; `base64` only wraps the decoded DER
# into the PEM that `reqwest::Identity::from_pem` (rustls) requires. Both are
# MIT OR Apache-2.0, so they pass the deny.toml licence allow-list.
p12 = "0.6"
base64 = "0.23"

[dev-dependencies]
# Drives the real `cpworker` binary from the end-to-end tests under `tests/`.
tempfile = "3"
# Local self-signed TLS server for the `cpm.client.tls.insecure_skip_verify`
# behaviour tests (upstream #232). `ring` is the provider reqwest already uses
# (via hyper-rustls), so no second crypto backend is pulled in.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
