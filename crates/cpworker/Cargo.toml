[package]
name = "cpworker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Netis Cloud Probe packet capture and forwarding engine (Rust port)"
publish = false   # internal port; see deny.toml [bans] allow-wildcard-paths

[[bin]]
name = "cpworker"
path = "src/main.rs"

[lib]
name = "cpworker"
path = "src/lib.rs"

[features]
# DPDK `pdump` capturer (`dpdk/pdump.c`). Off by default: the default build has
# no DPDK dependency at all. Enabling it requires DPDK (`pkg-config libdpdk`)
# and is checked by `build.rs`.
dpdk = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
nix.workspace = true
log.workspace = true
signal-hook.workspace = true
chrono.workspace = true
socket2.workspace = true
parking_lot.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
