[package]
name = "cpworker-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone workspace (keep the fuzz targets out of the main workspace).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
cpworker = { path = ".." }
cpgolib = { path = "../../cpgolib" }
cpsim = { path = "../../sim" }
serde_json = "1"

[[bin]]
name = "packet_split"
path = "fuzz_targets/packet_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zmq_batch"
path = "fuzz_targets/zmq_batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vxlan"
path = "fuzz_targets/vxlan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sim_dst"
path = "fuzz_targets/sim_dst.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_oracle"
path = "fuzz_targets/diff_oracle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zmtp_wire"
path = "fuzz_targets/zmtp_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zmtp_client"
path = "fuzz_targets/zmtp_client.rs"
test = false
doc = false
bench = false
